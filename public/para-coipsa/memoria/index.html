<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Memoria Integrada SMU 2025</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Lora:ital@0;1&display=swap');
  /* --up-strong y --down cumplen 4,5:1 sobre papel y sobre los fondos de los chips. */
  :root{ --bg:#f0efed; --ink:#1c1c1c; --paper:#fff; --muted:#6b6b6b; --line:#dcd8d0; --up:#0A9345; --up-strong:#07733A; --down:#c23b2e; --smu:#E1251A; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',Arial,sans-serif;}

  .app{display:grid;grid-template-columns:1fr;height:100vh;}
  .app-nav{background:#faf9f6;border-right:1px solid var(--line);overflow-y:auto;}
  .app-nav-head{padding:20px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .app-nav-head img{height:22px;display:block;}
  .app-nav-head .home-mini{background:none;border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;}
  .idx-title{padding:14px 20px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .idx-list .row{display:flex;align-items:center;gap:11px;padding:11px 18px;cursor:pointer;border:0;border-bottom:1px solid #efedE8;transition:background .15s ease;width:100%;text-align:left;background:#faf9f6;font-family:'Archivo',Arial,sans-serif;color:var(--ink);}
  .idx-list .row:hover{background:#f0eee8;}
  .idx-list .row.active{background:#eeecE5;}
  .idx-list .row .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .idx-list .row .n{font-family:'Archivo Black';font-size:12px;color:var(--muted);width:18px;flex:none;}
  .idx-list .row .t{font-size:12.5px;font-weight:600;flex:1;line-height:1.25;}
  .idx-list .row .p{font-size:11px;color:var(--muted);flex:none;}

  .app-main{display:flex;flex-direction:column;overflow:hidden;}
  .top-strip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff;flex:none;}
  .home-btn{background:none;border:none;cursor:pointer;padding:2px 4px;flex:none;display:flex;align-items:center;}
  .home-btn img{height:16px;display:block;}
  .rail{display:flex;gap:3px;flex:1;align-items:center;overflow-x:auto;}
  .rail .seg{
    height:15px;border-radius:3px;flex:1;min-width:14px;border:0;padding:0;
    cursor:pointer;transition:all .18s ease;opacity:.6;
    font-family:'Archivo Black';font-size:8.5px;line-height:15px;text-align:center;
  }
  .rail .seg:hover{opacity:.9;}
  .rail .seg.active{opacity:1;height:20px;line-height:20px;font-size:10px;}
  .rail-label{flex:none;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .idx-open-btn{flex:none;background:var(--ink);color:#fff;border:none;border-radius:14px;font-size:10.5px;font-weight:700;padding:6px 11px;cursor:pointer;}
  .app-view{overflow-y:auto;flex:1;position:relative;background:#fff;}

  /* ============ PORTADA ============ */
  .cover-screen{min-height:100%;display:flex;flex-direction:column;background:var(--bg);}
  .cover-top{padding:34px 30px 0;}
  .cover-top img{height:30px;display:block;margin-bottom:26px;}
  .cover-title{font-size:clamp(20px,3.2vw,30px);color:#3a3a3a;font-weight:400;line-height:1.1;letter-spacing:.01em;}
  .cover-title b{font-family:'Archivo Black';display:block;color:var(--ink);}
  .cover-stripes{
    flex:1;display:flex;gap:0;align-items:stretch;
    margin:30px 30px 0;min-height:220px;
  }
  .stripe{
    flex:1;cursor:pointer;position:relative;border:0;background:none;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    transition:flex .22s ease;
    padding:0 0 10px;
  }
  .stripe .bar{position:absolute;inset:0 26% 0 26%;transition:inset .22s ease;}
  .stripe:hover .bar, .stripe.hl .bar{inset:0 12% 0 12%;}
  .stripe .sn{position:relative;font-family:'Archivo Black';color:#fff;font-size:13px;}
  .stripe-caption{
    margin:14px 30px 0;min-height:44px;
    border-top:1.5px solid var(--ink);
    padding-top:10px;
    display:flex;align-items:baseline;gap:12px;
  }
  .stripe-caption .cap-n{font-family:'Archivo Black';font-size:26px;line-height:1;min-width:38px;}
  .stripe-caption .cap-t{font-size:14px;font-weight:700;line-height:1.25;}
  .stripe-caption .cap-hint{font-size:11px;color:var(--muted);font-weight:600;}
  .cover-kpis{padding:22px 30px 30px;}
  .cover-kpis .ck-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px;}
  .kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
  .kpi-strip.p3{grid-template-columns:repeat(3,1fr);}
  .kpi{border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;transition:border-color .15s;background:#fff;display:block;width:100%;text-align:left;font-family:'Archivo',Arial,sans-serif;color:var(--ink);}
  .kpi:hover{border-color:var(--ink);}
  .kpi .kv{display:block;font-family:'Archivo Black';font-size:15px;line-height:1;}
  .kpi .kl{display:block;font-size:8.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:4px;line-height:1.3;}
  .kpi .kd{display:block;font-size:9px;font-weight:700;margin-top:5px;}
  .kpi .kd .delta{margin-left:0;}
  .kpi .kd-note{color:#5a5a5a;}

  /* ============ CAPÍTULOS ============ */
  .ch-head{padding:18px 20px 14px;color:#fff;}
  .ch-head .n{font-family:'Archivo Black';font-size:30px;line-height:1;opacity:.9;}
  .ch-head .t{font-family:'Archivo Black';font-size:18px;line-height:1.15;margin-top:4px;}
  .ch-body{padding:18px 20px 34px;}
  .sec-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}

  .depth-toggle{display:flex;gap:0;margin:0 0 16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;width:max-content;}
  .depth-toggle button{border:none;background:#fff;font-family:'Archivo';font-size:10.5px;font-weight:700;padding:6px 14px;cursor:pointer;color:var(--muted);}
  .depth-toggle button.on{background:var(--ink);color:#fff;}
  .prose-block{font-size:12.5px;line-height:1.62;color:#3a3a3a;margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:none;}
  .prose-block.show{display:block;}
  .prose-block p{margin:0 0 10px;}

  .delta{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;}
  .delta.good{background:#e6f4ec;color:var(--up-strong);}
  .delta.bad{background:#fbeae7;color:var(--down);}
  .delta.flat{background:#f0eee8;color:#5a5a5a;}

  .letter{font-family:'Lora',serif;font-style:italic;font-size:13.5px;line-height:1.65;color:#2a2a2a;}
  .letter p{margin:0 0 12px;}
  .letter .sig{margin-top:16px;font-weight:600;font-style:normal;font-size:12px;color:var(--muted);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .stat{background:#fdf3e8;border-radius:6px;padding:12px;}
  .stat.wide{grid-column:1/-1;background:#F0A400;color:#1c1c1c;}
  .stat.wide .rv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .stat .big{font-family:'Archivo Black';font-size:26px;line-height:1;}
  .stat.wide .big{font-size:40px;}
  .stat .lab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;color:#7a4a00;}
  .stat.wide .lab{color:#1c1c1c;opacity:.78;margin-top:0;}
  .stat.wide .rv-body{border-top-color:rgba(0,0,0,.25);}
  .brand-row{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;border-bottom:1px solid #eee0c8;}
  .brand-row b{font-weight:700;}

  .mat-pillar{margin-bottom:18px;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .mat-pillar .mp-head{padding:9px 14px;color:#fff;font-family:'Archivo Black';font-size:11.5px;}
  .mat-row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid #f0eee8;}
  .mat-row:last-child{border-bottom:none;}
  .mat-row .theme{width:96px;flex:none;font-size:11px;font-weight:700;line-height:1.3;color:#3a3a3a;}
  .mat-row .adv{flex:1;font-size:11.5px;line-height:1.5;color:#4a4a4a;}
  .mat-row .adv ul{margin:0;padding-left:14px;}
  .mat-row .adv li{margin-bottom:3px;}
  .ods-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .ods-tag{font-size:9.5px;font-weight:700;background:#eee9f5;color:#4A1371;padding:2px 6px;border-radius:3px;}

  .gov-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:16px;}
  .board-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .board-card{border:1px solid var(--line);border-radius:6px;padding:12px;}
  .board-card .role{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#8A6108;}
  .board-card .name{font-family:'Archivo Black';font-size:13px;margin:3px 0 6px;line-height:1.15;}
  .board-card .bio{font-size:10.5px;color:#5a5a5a;line-height:1.45;}
  .board-card .own{margin-top:8px;font-size:10px;color:var(--muted);font-weight:600;}
  .donut-wrap{display:flex;align-items:center;gap:18px;margin:8px 0 6px;flex-wrap:wrap;}
  .donut-legend{flex:1;min-width:150px;}
  .donut-legend .dl-row{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px solid #f0eee8;}
  .donut-legend .dl-row b{font-weight:700;}

  .eth-stat-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .eth-stat{flex:1;min-width:100px;background:#fbf0e8;border-radius:6px;padding:14px;}
  .eth-stat .big{font-family:'Archivo Black';font-size:22px;line-height:1;color:#a24d1a;}
  .eth-stat .lab{font-size:10px;color:#6b4526;font-weight:700;margin-top:3px;line-height:1.3;}
  .values-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .value-chip{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:14px;background:#D46A2A;color:#fff;}
  .dtable{width:100%;border-collapse:collapse;font-size:10.5px;}
  .dtable th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:6px;border-bottom:1.5px solid var(--ink);}
  .dtable td{padding:6px;border-bottom:1px solid #f0eee8;}
  .dtable td.num{text-align:right;font-weight:600;}
  .dtable tr.total td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:none;}

  .hero-num{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .hero-num .hn{font-family:'Archivo Black';font-size:52px;line-height:1;}
  .hero-sub{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:14px;}
  .palancas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .palanca{background:#f7edf3;border-radius:6px;padding:9px 12px;font-size:10.5px;font-weight:700;color:#89225A;}
  .clubs{display:flex;gap:8px;flex-wrap:wrap;}
  .club{border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:10.5px;font-weight:700;color:#3a3a3a;}

  .soc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .soc{border:1px solid var(--line);border-radius:6px;padding:12px;}
  .soc .sv{font-family:'Archivo Black';font-size:19px;color:#0A9345;line-height:1.05;}
  .soc .sl{font-size:10px;font-weight:700;color:#3a3a3a;margin-top:4px;line-height:1.35;}

  .doc-map .dm{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px;}
  .doc-map .dm .ic{width:34px;height:34px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black';color:#fff;font-size:13px;background:#3B7D9C;}
  .doc-map .dm .dt{font-size:12px;font-weight:700;}
  .doc-map .dm .dd{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4;}

  /* ============ ACCESIBILIDAD BASE ============ */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  [hidden]{display:none !important;}
  button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid #0B57D0;outline-offset:2px;border-radius:3px;}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;}
  }

  /* ---- glosario en línea ---- */
  .term{
    font:inherit;color:inherit;background:none;border:0;padding:0;
    border-bottom:1.5px dotted currentColor;font-weight:700;cursor:pointer;
  }
  .term:hover,.term[aria-expanded="true"]{background:#fdf3e8;}
  .gloss{
    position:fixed;z-index:60;max-width:290px;
    background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;
    font-size:11.5px;line-height:1.45;
    box-shadow:0 8px 26px rgba(0,0,0,.28);
    opacity:0;visibility:hidden;transition:opacity .14s ease;
  }
  .gloss.open{opacity:1;visibility:visible;}
  .gloss .gl-t{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:#FFCF5C;margin-bottom:4px;}

  /* ---- revelación en el lugar ---- */
  .rv{position:relative;}
  .rv-head{position:relative;display:block;width:100%;text-align:left;background:none;border:0;padding:0 20px 0 0;font:inherit;color:inherit;cursor:pointer;font-family:'Archivo',Arial,sans-serif;}
  .rv-head .rv-mark{position:absolute;top:0;right:0;font-family:'Archivo Black';font-size:14px;opacity:.5;line-height:1;}
  .rv-body{margin-top:9px;padding-top:8px;border-top:1px solid rgba(0,0,0,.14);}
  .rv-row{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;line-height:1.4;padding:4px 0;}
  .rv-row b{font-weight:700;white-space:nowrap;}
  .rv-note{font-size:10.5px;line-height:1.5;color:#5a5a5a;margin-top:6px;}

  .board-toggle{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;position:relative;}
  .board-toggle .caret{position:absolute;right:0;top:4px;font-family:'Archivo Black';font-size:13px;color:#5a5a5a;}
  .board-toggle .name{display:block;padding-right:16px;}

  /* ---- estimación integrada a la narrativa ---- */
  .est-p{font-size:13px;line-height:1.65;color:#3a3a3a;margin:0 0 12px;}
  .est-p .ask{font-weight:700;color:var(--ink);}
  .est-chart{display:flex;gap:22px;height:180px;margin:6px 0 6px;}
  .est-col{flex:1;max-width:150px;position:relative;}
  .est-zero{position:absolute;left:0;right:0;border-top:1.5px solid var(--ink);}
  .est-ph{position:absolute;left:16%;right:16%;top:0;bottom:0;border:1.5px dashed #7a746a;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black';font-size:26px;color:#7a746a;}
  .est-bar{position:absolute;left:16%;right:16%;border-radius:3px;transition:top .8s cubic-bezier(.2,.85,.25,1),height .8s cubic-bezier(.2,.85,.25,1);}
  .est-val{position:absolute;left:0;right:0;text-align:center;font-family:'Archivo Black';font-size:15px;}
  .est-labels{display:flex;gap:22px;margin-bottom:16px;}
  .est-lab{flex:1;max-width:150px;font-size:10.5px;font-weight:700;line-height:1.35;color:#4a4a4a;}
  .est-opts{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px;}
  .est-opt{font-family:'Archivo';font-size:11.5px;font-weight:700;padding:8px 15px;border:1.5px solid var(--line);border-radius:18px;background:#fff;color:#3a3a3a;cursor:pointer;}
  .est-opt:hover{border-color:var(--ink);}
  .est-opt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .est-opts.answered .est-opt:not([aria-pressed="true"]){opacity:.45;}
  .est-after{font-size:13px;line-height:1.65;color:#3a3a3a;}
  .est-after p{margin:0 0 12px;}
  .est-cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px;}
  .est-cif{border:1px solid var(--line);border-radius:6px;padding:10px;}
  .est-cif .ec-v{font-family:'Archivo Black';font-size:15px;line-height:1.1;}
  .est-cif .ec-l{font-size:9.5px;font-weight:700;color:#5a5a5a;line-height:1.35;margin-top:4px;}
  .est-links{display:flex;flex-wrap:wrap;gap:7px;}
  .est-link{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:6px 12px;font-family:'Archivo';font-size:10.5px;font-weight:700;color:#3a3a3a;cursor:pointer;}
  .est-link:hover{border-color:var(--ink);}
  .est-link .dot{width:9px;height:9px;border-radius:50%;flex:none;}

  /* ---- sparkline en línea ---- */
  .spark{display:inline-block;vertical-align:-2px;margin:0 4px;}

  /* ---- gráfico SSS ---- */
  .sss-controls{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;width:max-content;margin:0 0 14px;}
  .sss-controls button{border:0;background:#fff;font-family:'Archivo';font-size:10.5px;font-weight:700;padding:6px 15px;cursor:pointer;color:var(--muted);}
  .sss-controls button[aria-pressed="true"]{background:var(--ink);color:#fff;}
  .sss-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
  .sss-chart{flex:1;min-width:230px;}
  .sss-row{display:grid;grid-template-columns:5fr 1fr;align-items:stretch;height:28px;}
  .sss-neg{position:relative;height:100%;border-right:1.5px solid var(--ink);}
  .sss-pos{position:relative;height:100%;}
  .sss-neg i,.sss-pos i{position:absolute;top:6px;bottom:6px;display:block;transition:width .45s ease;}
  .sss-neg i{right:0;border-radius:3px 0 0 3px;}
  .sss-pos i{left:0;border-radius:0 3px 3px 0;}
  .sss-row.hl i{filter:brightness(.72);}
  .sss-legend{flex:0 0 220px;}
  /* La leyenda comparte la altura de fila del gráfico: barra y fila quedan en registro. */
  .sss-leg{display:flex;width:100%;height:28px;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid #f0eee8;padding:0 5px;font-family:'Archivo';font-size:11.5px;color:#3a3a3a;text-align:left;cursor:pointer;}
  .sss-leg b{font-weight:700;font-variant-numeric:tabular-nums;}
  .sss-leg.hl{background:#f2f0ea;}
  .sss-leg.tot{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:700;}

  /* ---- cuadrícula unitaria ---- */
  .ug{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:238px;margin:12px 0 12px;}
  .ug i{display:block;width:100%;padding-top:100%;border-radius:50%;transition:transform .15s ease,opacity .15s ease;}
  .ug.focus i:not(.on){opacity:.28;}
  .ug i.on{transform:scale(1.12);}
  .ug-legend{display:flex;gap:8px;flex-wrap:wrap;}
  .ug-leg{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:18px;background:#fff;padding:7px 13px;font-family:'Archivo';font-size:11px;font-weight:700;color:#3a3a3a;cursor:pointer;}
  .ug-leg.hl{border-color:var(--ink);}
  .ug-leg .sw{width:10px;height:10px;border-radius:50%;flex:none;}
  .ug-note{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:10px;}

  /* ---- entrada por perfil de lector ---- */
  .perfil{margin:24px 30px 0;}
  .perfil-lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .perfil-opts{display:flex;gap:7px;flex-wrap:wrap;}
  .perfil-opt{font-family:'Archivo';font-size:11px;font-weight:700;padding:7px 15px;border:1.5px solid var(--line);border-radius:18px;background:#fff;color:#3a3a3a;cursor:pointer;}
  .perfil-opt:hover{border-color:var(--ink);}
  .perfil-opt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---- procedencia ---- */
  .fuente{margin-top:28px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;line-height:1.6;color:var(--muted);}

// ============ UTILIDADES DE COLOR Y CONTRASTE ============
// El color de capítulo nunca porta información por sí solo, pero sí funciona como
// superficie. Estas funciones garantizan contraste AA sobre cada una de las 12 superficies.
function hexToRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function relLum(rgb){const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};return 0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);}
function contrast(a,b){const l1=relLum(a),l2=relLum(b);const hi=Math.max(l1,l2),lo=Math.min(l1,l2);return (hi+0.05)/(lo+0.05);}
function toHex(rgb){return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}

// Superficie de color apta para texto: oscurece el color de capítulo hasta que
// alguna de las dos tintas (blanco o negro) alcanza 4,5:1.
const _bgCache={};
function bgFor(hex){
  if(_bgCache[hex]) return _bgCache[hex];
  let rgb=hexToRgb(hex), k=1;
  while(k>0.3 && Math.max(contrast(rgb,[255,255,255]),contrast(rgb,[28,28,28]))<4.5){
    k-=0.05; rgb=hexToRgb(hex).map(v=>v*k);
  }
  return _bgCache[hex]=toHex(rgb);
}
// Tinta sobre una superficie de color.
function textOn(hex){
  const rgb=hexToRgb(hex);
  return contrast(rgb,[255,255,255])>=contrast(rgb,[28,28,28])?'#ffffff':'#1c1c1c';
}
// Color de capítulo usable como texto sobre papel blanco.
const _inkCache={};
function inkOn(hex){
  if(_inkCache[hex]) return _inkCache[hex];
  let rgb=hexToRgb(hex), k=1;
  while(k>0.15 && contrast(rgb,[255,255,255])<4.5){ k-=0.04; rgb=hexToRgb(hex).map(v=>v*k); }
  return _inkCache[hex]=toHex(rgb);
}

// Definiciones cortas para términos que cruzan capítulos. Aparecen al pasar el cursor
// (600 ms), al hacer clic y al recibir foco de teclado. No navegan ni abren paneles.
const GLOSARIO = {
  mayorista10:{t:'Mayorista 10', d:'Formato mayorista incorporado por SMU en 2008. Durante 2025 se aceleró su conversión a los formatos Alvi y Super10.'},
  cien:{t:'100% Nuestro', d:'Programa de Unimarc que incorpora productos de micro, pequeñas y medianas empresas al surtido. Nace en 2012 en la región de Aysén; 170 proveedores en 2025.'},

  peru:{t:'Perú', d:'SMU opera allí los supermercados soft discount Maxiahorro (30 locales) y las tiendas mayoristas Mayorsa (5), más un centro de distribución en Piura.'},
  ey:{t:'EY', d:'Verificador externo del reporte: emitió el informe de aseguramiento de los indicadores GRI y NCG 461 (p. 340-348).'},
};
const TERMINOS = [
  ['Mayorista 10','mayorista10'],
  ['100% Nuestro','cien'],
  ['Descúbreme','descubreme'],
  ['Teletón','teleton'],
  ['Alvi','alvi'],
  ['Perú','peru'],
  ['EY','ey'],
];
const _AL = '0-9A-Za-zÁÉÍÓÚÜÑáéíóúüñ';
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
const GL_RE = new RegExp('(^|[^'+_AL+'])('+TERMINOS.map(t=>escRe(t[0])).join('|')+')(?![' + _AL + '])','g');

let glDone = new Set();
function glReset(){ glDone = new Set(); }
// Marca la primera aparición de cada término dentro del capítulo en curso.
function gl(txt){
  return String(txt).replace(GL_RE,(m,pre,term)=>{
    const par = TERMINOS.find(t=>t[0]===term);
    if(!par || glDone.has(par[1])) return m;
    glDone.add(par[1]);
    return pre+`<button type="button" class="term" data-g="${par[1]}" aria-expanded="false">${term}</button>`;
  });
}

let glTimer=null, glOpen=null, glShownAt=0;
function glShow(btn){
  const g = GLOSARIO[btn.dataset.g]; if(!g) return;
  if(glOpen && glOpen!==btn) glClear(glOpen);
  const el = document.getElementById('gloss');
  el.innerHTML = `<span class="gl-t">${g.t}</span>${g.d}`;
  el.classList.add('open');
  el.style.left='0px'; el.style.top='0px';
  const r = btn.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let x = r.left + r.width/2 - w/2;
  x = Math.max(10, Math.min(x, window.innerWidth - w - 10));
  let y = r.top - h - 9;
  if(y < 8) y = r.bottom + 9;
  el.style.left = x+'px'; el.style.top = y+'px';
  btn.setAttribute('aria-expanded','true');
  btn.setAttribute('aria-describedby','gloss');
  glOpen = btn; glShownAt = Date.now();
}
function glClear(b){ b.setAttribute('aria-expanded','false'); b.removeAttribute('aria-describedby'); }
function glHide(){
  if(glOpen) glClear(glOpen);
  glOpen = null;
  document.getElementById('gloss').classList.remove('open');
}
function _term(e){ return e.target && e.target.closest ? e.target.closest('.term') : null; }
document.addEventListener('mouseover',e=>{
  const b=_term(e); if(!b) return;
  clearTimeout(glTimer);
  glTimer=setTimeout(()=>glShow(b),600);
});
document.addEventListener('mouseout',e=>{
  const b=_term(e); if(!b) return;
  clearTimeout(glTimer);
  if(glOpen===b && document.activeElement!==b) glHide();
});
document.addEventListener('focusin',e=>{
  const b=_term(e);
  if(b) glShow(b); else if(glOpen && document.activeElement!==glOpen) glHide();
});
document.addEventListener('click',e=>{
  const b=_term(e);
  if(b){
    clearTimeout(glTimer);
    if(glOpen===b){ if(Date.now()-glShownAt>400) glHide(); }
    else glShow(b);
    return;
  }
  if(glOpen) glHide();
});

}
function rvRows(pairs){

}
function toggleRv(btn){
  const open = btn.getAttribute('aria-expanded')==='true';
  btn.setAttribute('aria-expanded', String(!open));
  const body = document.getElementById(btn.getAttribute('aria-controls'));
  if(body) body.hidden = open;
  const mark = btn.querySelector('.rv-mark');
  if(mark) mark.textContent = open ? '+' : '–';
}

  const body = document.getElementById(btn.getAttribute('aria-controls'));
  if(body) body.hidden = open;

// ============ SPARKLINE ============
// Micro-gráfico del tamaño de una palabra. La serie completa va en el aria-label
// y en el texto que acompaña la cifra: nunca es el único portador del dato.
// La serie, escrita: el sparkline nunca es el único portador del dato.
function serieTexto(key){
  const s = SERIES[key]; if(!s) return '';
  return s.puntos.map(p=>p.anio+': '+p.display).join(' · ');
}
function sparkline(key){
  const s = SERIES[key]; if(!s) return '';
  const p = s.puntos, w = 44, h = 13, pad = 2;
  const vs = p.map(x=>x.valor);
  const min = Math.min(...vs), max = Math.max(...vs), rango = (max-min)||1;
  const pts = p.map((x,i)=>{
    const px = pad + i*((w-pad*2)/(p.length-1||1));
    const py = pad + (max-x.valor)/rango*(h-pad*2);
    return [px,py];
  });
  const d = pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const fin = pts[pts.length-1];
  const lab = s.etiqueta+': '+p.map(x=>x.anio+', '+x.display).join('; ')+'.';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${lab}" focusable="false">
    <path d="${d}" fill="none" stroke="#1c1c1c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${fin[0].toFixed(1)}" cy="${fin[1].toFixed(1)}" r="2" fill="#1c1c1c"/></svg>`;
}

  labs += `<div class="est-lab">${e.incognita.lab}</div>`;

  const opts = e.opciones.map(o=>
    `<button type="button" class="est-opt" data-k="${o.k}" aria-pressed="${elegida===o.k}" onclick="estResponder(${n},'${o.k}')">${o.t}</button>`
  ).join('');

  return `<p class="est-p">${gl(e.intro)}</p>
    <div class="est-opts${elegida?' answered':''}" id="est-opts-${n}" role="group" aria-label="Estimación del lector — no hay respuesta correcta ni puntaje">${opts}</div>
    <div class="est-chart" id="est-chart-${n}" role="img" aria-label="${estAria(n)}">${cols}</div>
    <div class="est-labels">${labs}</div>
    <div class="est-after" id="est-after-${n}" aria-live="polite">${elegida?estRevelacionHtml(n,elegida):''}</div>`;
}
function estAria(n){
  const e = ESTIMACIONES[n];
  const base = e.conocido ? `${e.conocido.lab}: ${fmtPct(e.conocido.v)}. ` : '';
  return estElegida[n]
    ? base+`${e.incognita.lab}: ${fmtPct(e.incognita.v)}.`
    : base+`${e.incognita.lab}: sin revelar hasta que respondas.`;
}
function estRevelacionHtml(n, k){
  const e = ESTIMACIONES[n];
  const ch = chapters.find(c=>c.n===n);
  const o = e.opciones.find(x=>x.k===k);
  const cifras = e.cifras.map(c=>`<div class="est-cif"><div class="ec-v" style="color:${inkOn(ch.color)}">${c.v()}</div><div class="ec-l">${c.l()}</div></div>`).join('');
  const enlaces = e.enlaces.map(m=>{
    const c = chapters.find(x=>x.n===m);
    return `<button type="button" class="est-link" onclick="selectChapter(${m})"><span class="dot" style="background:${c.color}"></span>Cap. ${c.n} — ${c.title}</button>`;
  }).join('');
  return `<p>${gl(o.r)}</p><p>${gl(e.revelacion)}</p>
    <div class="sec-k" style="color:${inkOn(ch.color)}">${e.cifrasTitulo}</div>
    <div class="est-cifras">${cifras}</div>
    <p>${gl(e.cierre)}</p>
    <div class="est-links">${enlaces}</div>`;
}
function estResponder(n, k){
  if(estElegida[n]) return;
  estElegida[n] = k;
  const e = ESTIMACIONES[n];
  const g = _estGeo(e, e.incognita.v);
  const ph = document.getElementById('est-ph-'+n); if(ph) ph.hidden = true;
  const bar = document.getElementById('est-bar-'+n);
  if(bar){ bar.style.top = g.top+'%'; bar.style.height = g.alto+'%'; }
  const val = document.getElementById('est-val-'+n); if(val) val.style.opacity = 1;
  const chart = document.getElementById('est-chart-'+n); if(chart) chart.setAttribute('aria-label', estAria(n));
  const opts = document.getElementById('est-opts-'+n);
  if(opts){
    opts.classList.add('answered');
    opts.querySelectorAll('.est-opt').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.k===k)));
  }
  const after = document.getElementById('est-after-'+n);
  if(after) after.innerHTML = estRevelacionHtml(n, k);
}

let sssVista = 'anio';
function sssHtml(color){
  const c = inkOn(color);
  const barras = SSS.filas.map(f=>{
    const v = f[sssVista];
    return `<div class="sss-row" data-k="${f.k}" onmouseenter="sssHl('${f.k}',true)" onmouseleave="sssHl('${f.k}',false)">
      <div class="sss-neg"><i style="width:${v<0?(Math.abs(v)/SSS.escala.neg*100):0}%;background:${f.total?'#1c1c1c':c}"></i></div>
      <div class="sss-pos"><i style="width:${v>0?(v/SSS.escala.pos*100):0}%;background:${f.total?'#1c1c1c':c}"></i></div>
    </div>`;
  }).join('');
  const leyenda = SSS.filas.map(f=>
    `<button type="button" class="sss-leg${f.total?' tot':''}" data-k="${f.k}"
      onmouseenter="sssHl('${f.k}',true)" onmouseleave="sssHl('${f.k}',false)"
      onfocus="sssHl('${f.k}',true)" onblur="sssHl('${f.k}',false)">
      <span>${f.nombre}</span><b data-v="${f.k}">${fmtPct(f[sssVista])}</b></button>`
  ).join('');
  const ctrl = SSS.vistas.map(v=>
    `<button type="button" aria-pressed="${sssVista===v.k}" onclick="sssSet('${v.k}')">${v.lab}</button>`
  ).join('');
  return `<div class="sss-controls" role="group" aria-label="Métrica del gráfico de ventas de locales equivalentes">${ctrl}</div>
    <div class="sss-wrap">
      <div class="sss-chart" id="sss-chart" aria-hidden="true">${barras}</div>
      <div class="sss-legend" id="sss-legend" role="group" aria-label="Ventas de locales equivalentes por segmento — los valores se leen aquí">${leyenda}</div>
    </div>`;
}
function sssSet(k){
  sssVista = k;
  document.querySelectorAll('.sss-controls button').forEach(b=>b.setAttribute('aria-pressed', String(b.textContent.trim()===(SSS.vistas.find(v=>v.k===k)||{}).lab)));
  SSS.filas.forEach(f=>{
    const v = f[k];
    const row = document.querySelector('.sss-row[data-k="'+f.k+'"]');
    if(row){
      row.querySelector('.sss-neg i').style.width = (v<0?(Math.abs(v)/SSS.escala.neg*100):0)+'%';
      row.querySelector('.sss-pos i').style.width = (v>0?(v/SSS.escala.pos*100):0)+'%';
    }
    const val = document.querySelector('.sss-leg b[data-v="'+f.k+'"]');
    if(val) val.textContent = fmtPct(v);
  });
}
function sssHl(k, on){
  const row = document.querySelector('.sss-row[data-k="'+k+'"]');
  const leg = document.querySelector('.sss-leg[data-k="'+k+'"]');
  if(row) row.classList.toggle('hl', on);
  if(leg) leg.classList.toggle('hl', on);
}

const UG_COLOR = {m:'#B81E15', h:'#5a5a5a'};
function ugHtml(){
  const pm = D('mujeres_dotacion').valor / D('dotacion_2025').valor * 100;
  const nm = Math.round(pm), nh = 100 - nm;
  const porPunto = Math.round(D('dotacion_2025').valor / 100);
  const puntos = Array.from({length:100},(_,i)=>{
    const g = i < nm ? 'm' : 'h';
    return `<i class="ug-dot" data-g="${g}" style="background:${UG_COLOR[g]}"></i>`;
  }).join('');
  return `<div class="ug" id="ug" aria-hidden="true">${puntos}</div>
    <div class="ug-legend" role="group" aria-label="Composición de la dotación por género">
      <button type="button" class="ug-leg" data-g="m" onmouseenter="ugHl('m',true)" onmouseleave="ugHl('m',false)" onfocus="ugHl('m',true)" onblur="ugHl('m',false)">
        <span class="sw" style="background:${UG_COLOR.m}"></span>Mujeres · ${V('mujeres_dotacion')} · ${pm.toFixed(1).replace('.',',')}%</button>
      <button type="button" class="ug-leg" data-g="h" onmouseenter="ugHl('h',true)" onmouseleave="ugHl('h',false)" onfocus="ugHl('h',true)" onblur="ugHl('h',false)">
        <span class="sw" style="background:${UG_COLOR.h}"></span>Hombres · ${V('hombres_dotacion')} · ${(100-pm).toFixed(1).replace('.',',')}%</button>
    </div>
    <div class="ug-note">Cada punto representa ${porPunto.toLocaleString('es-CL')} personas. La cuadrícula redondea la proporción a ${nm} y ${nh} puntos sobre ${V('dotacion_2025')} colaboradores.</div>`;
}
function ugHl(g, on){
  const grid = document.getElementById('ug');
  if(grid){
    grid.classList.toggle('focus', on);
    grid.querySelectorAll('.ug-dot').forEach(d=>d.classList.toggle('on', on && d.dataset.g===g));
  }
  const btn = document.querySelector('.ug-leg[data-g="'+g+'"]');
  if(btn) btn.classList.toggle('hl', on);
}

// ============ COMPONENTES DE PRESENTACIÓN ============
// El signo ▲▼ acompaña siempre al color: el chip no depende de la tinta para leerse.
function deltaChip(text, dir, favorable){
  const glifo = dir==='up'?'▲':dir==='down'?'▼':'=';
  const tono = favorable===true?'good':favorable===false?'bad':'flat';
  const lectura = dir==='up'?'al alza':dir==='down'?'a la baja':'sin variación';
  return `<span class="delta ${tono}"><span aria-hidden="true">${glifo}</span> ${text}<span class="sr-only"> (${lectura})</span></span>`;
}
function depthToggleHtml(n){
  if(!prosa[n]) return '';
  return `<div class="depth-toggle" role="group" aria-label="Profundidad de lectura del capítulo">
    <button type="button" class="on" aria-pressed="true" onclick="setDepth(${n},'esencial',this)">Esencial</button>
    <button type="button" aria-pressed="false" onclick="setDepth(${n},'completo',this)">Completo</button></div>`;
}
function prosaHtml(n){
  if(!prosa[n]) return '';
  return `<div class="prose-block" id="prosa-${n}">${prosa[n].map(p=>`<p>${gl(p)}</p>`).join('')}</div>`;
}
function setDepth(n, mode, btn){
  const block = document.getElementById('prosa-'+n);
  if(!block) return;
  block.classList.toggle('show', mode==='completo');
  btn.parentElement.querySelectorAll('button').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');});
  btn.classList.add('on'); btn.setAttribute('aria-pressed','true');
}

// ============ NAVEGACIÓN ============
const idxList=document.getElementById('idx-list');
const appView=document.getElementById('app-view');
const appEl=document.getElementById('app');
const rail=document.getElementById('rail');
const railLabel=document.getElementById('rail-label');

chapters.forEach(ch=>{
  const row=document.createElement('button');
  row.type='button'; row.className='row'; row.dataset.n=ch.n;
  row.innerHTML=`<span class="dot" aria-hidden="true" style="background:${ch.color}"></span><span class="n">${ch.n}</span><span class="t">${ch.title}</span><span class="p">p.${ch.page}</span>`;
  row.addEventListener('click',()=>selectChapter(ch.n));
  idxList.appendChild(row);

  const seg=document.createElement('button');
  seg.type='button'; seg.className='seg'; seg.dataset.n=ch.n;
  seg.style.background=bgFor(ch.color); seg.style.color=textOn(bgFor(ch.color));
  seg.textContent=ch.n;
  seg.setAttribute('aria-label',`Capítulo ${ch.n} — ${ch.title}`);
  seg.addEventListener('click',()=>selectChapter(ch.n));
  rail.appendChild(seg);
});

function highlightNav(n){
  idxList.querySelectorAll('.row').forEach(r=>{
    const on = Number(r.dataset.n)===n;
    r.classList.toggle('active',on);
    if(on) r.setAttribute('aria-current','true'); else r.removeAttribute('aria-current');
  });
  rail.querySelectorAll('.seg').forEach(s=>{
    const on = Number(s.dataset.n)===n;
    s.classList.toggle('active',on);
    if(on) s.setAttribute('aria-current','true'); else s.removeAttribute('aria-current');
  });
}

function selectChapter(n){
  const ch=chapters.find(c=>c.n===n);
  glHide(); glReset();
  const bg = bgFor(ch.color);
  appView.innerHTML=`<div class="ch-head" style="background:${bg};color:${textOn(bg)}"><div class="n">${ch.n}</div><div class="t">${ch.title}</div></div>
    <div class="ch-body">${bodyHtmlFor(ch)}${fuenteCap(ch)}</div>`;
  highlightNav(n);
  railLabel.textContent=`Cap. ${n} de 12`;
  appEl.classList.remove('mode-list');
  appEl.classList.add('mode-view');
  appView.scrollTop=0;
  appView.focus({preventScroll:true});
}

function capUpdate(n){
  const ch = chapters.find(c=>c.n===n);
  const cap = document.getElementById('stripe-caption');
  if(!cap) return;
  cap.innerHTML = `<span class="cap-n" style="color:${inkOn(ch.color)}">${ch.n}</span><span class="cap-t">${ch.title}</span>`;
}
function capReset(){
  const cap = document.getElementById('stripe-caption');
  if(!cap) return;
  cap.innerHTML = `<span class="cap-hint">12 capítulos — recorre las franjas para ver cada título, toca para entrar</span>`;
}

function openList(){
  appEl.classList.remove('mode-view');
  appEl.classList.add('mode-list');
  const primera = idxList.querySelector('.row');
  if(primera) primera.focus();
}

// ---- Teclado: Escape cierra cualquier elemento desplegado ----
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(glOpen){ const b=glOpen; glHide(); b.focus(); return; }
  cerrarExpandidos();
});
// El glosario flota sobre la página: se cierra al desplazar.
appView.addEventListener('scroll',()=>{ if(glOpen) glHide(); },{passive:true});
window.addEventListener('resize',()=>{ if(glOpen) glHide(); });

showCover();
</script>
</body>
</html>
